<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="logo-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#0c0c0e" />
    </linearGradient>
    <linearGradient id="logo-hook-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Icon Mark (48x48) centered vertically at x=6, y=6 -->
  <g transform="translate(6, 6)">
    <rect width="48" height="48" rx="12" fill="url(#logo-bg-grad)" stroke="#27272a" stroke-width="1.5" />
    <g filter="url(#logo-glow)" transform="translate(4, 3) scale(1.25)">
      <path d="M10 20.5V11.5C10 9.57 11.57 8 13.5 8H17C18.93 8 20.5 9.57 20.5 11.5C20.5 13.43 18.93 15 17 15H12" 
            stroke="url(#logo-hook-grad)" 
            stroke-width="2.6" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <circle cx="10" cy="21.5" r="2.2" fill="#38bdf8" />
      <circle cx="23.5" cy="8.5" r="2.4" fill="#10b981" />
      <circle cx="23.5" cy="8.5" r="3.5" stroke="#10b981" stroke-width="0.9" opacity="0.6" />
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="68" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5" fill="#f4f4f5">
    Hook<tspan fill="#10b981">Lab</tspan>
  </text>
  <rect x="175" y="24" width="54" height="18" rx="4" fill="#27272a" />
  <text x="182" y="36.5" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#a1a1aa" letter-spacing="0.5">
    TOOLS
  </text>
</svg>
