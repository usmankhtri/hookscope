<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="hs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="hs-scope" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="hs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#10b981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Sleek Squircle Container -->
  <rect width="32" height="32" rx="8" fill="url(#hs-bg)" stroke="#27272a" stroke-width="1" />

  <!-- Scope Reticle Crosshairs (Fine Precision Guides) -->
  <g opacity="0.4" stroke="#71717a" stroke-width="1" stroke-linecap="round">
    <line x1="16" y1="4.5" x2="16" y2="7.5" />
    <line x1="16" y1="24.5" x2="16" y2="27.5" />
    <line x1="4.5" y1="16" x2="7.5" y2="16" />
    <line x1="24.5" y1="16" x2="27.5" y2="16" />
    <!-- Outer Scope Ring Segment -->
    <circle cx="16" cy="16" r="10.5" stroke="#3f3f46" stroke-width="0.8" stroke-dasharray="2 3" fill="none" />
  </g>

  <!-- Glowing Webhook Scope Hook -->
  <g filter="url(#hs-glow)">
    <!-- Webhook Ingestion Loop -->
    <path
      d="M10 21V11.5C10 9.57 11.57 8 13.5 8H17C18.93 8 20.5 9.57 20.5 11.5C20.5 13.43 18.93 15 17 15H11.5"
      stroke="url(#hs-scope)"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Input Ingestion Point (Cyan) -->
    <circle cx="10" cy="21.5" r="2" fill="#38bdf8" />

    <!-- Scope Target Radar Ping (Emerald) -->
    <circle cx="22.5" cy="8.5" r="2" fill="#10b981" />
    <circle cx="22.5" cy="8.5" r="3.2" stroke="#10b981" stroke-width="0.75" opacity="0.7" />
  </g>
</svg>
